# nginx site for the DCLM Bahrain CMS.
#
# Copy to /etc/nginx/sites-available/dclm, replace cms.dclm-bh.org with
# your domain, then:
#   sudo ln -s /etc/nginx/sites-available/dclm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot afterwards; it rewrites this file to add HTTPS.

server {
    listen 80;
    server_name cms.dclm-bh.org;

    # Receipt uploads. Raise if the church scans large documents.
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://unix:/home/dclm/dclm-backend/dclm.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # monthly report PDFs take a moment
    }

    location /admin/ {
        proxy_pass http://unix:/home/dclm/dclm-backend/dclm.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /home/dclm/dclm-backend/media/;
    }

    location /static/ {
        alias /home/dclm/dclm-backend/staticfiles/;
    }

    # The React app handles its own routing, so anything unmatched
    # returns index.html rather than a 404.
    root /home/dclm/dclm-frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
