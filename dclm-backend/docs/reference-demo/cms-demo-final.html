function reportPreview(period){
  const prefix = periodPrefix(period);
  const incomeThis = GIVING.filter(g=>g.date.slice(0,7)===prefix).reduce((s,g)=>s+g.amount,0);
  const expenseThis = EXPENSES.filter(x=>x.date.slice(0,7)===prefix).reduce((s,x)=>s+x.amount,0);
  const fwSessions = SESSIONS.filter(s=>s.meetingId==='fri-worship' && s.status==='filled' && s.date.slice(0,7)===prefix);
  const fwTotal = fwSessions.reduce((s,x)=>s+Object.values(x.counts).reduce((a,b)=>a+b,0),0);
  const testis = TESTIMONIES.filter(t=>t.date.slice(0,7)===prefix);
  const notes = WEEKLY_NOTES.filter(n=>(n.weekStart||'').slice(0,7)===prefix);
  return `
  <div style="border:1px dashed var(--line);border-radius:10px;padding:20px;background:var(--sky-2)">
    <div class="muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Cover</div>
    <div style="font-weight:800">Deeper Life Bible Church, Bahrain — Monthly Report</div>
    <div class="muted" style="font-size:.85rem">dclm-bh.org · +973 0000 0000 · ${period}</div>

    <div class="muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px">Executive Summary</div>
    <div style="font-size:.88rem">Friday Worship attendance totaled ${fwTotal} across ${fwSessions.length} recorded session(s) this period, with giving of ${fmt(incomeThis)} against ${fmt(expenseThis)} in expenses.</div>

    <div class="muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px">Testimonies</div>
    ${testis.length ? testis.map(t=>`<div style="font-size:.85rem;margin-bottom:6px">"${t.text}" — ${t.anon?'Anonymous':t.name} (${t.service})</div>`).join('') : '<div class="muted" style="font-size:.85rem">None recorded this period.</div>'}

    <div class="muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px">Challenges (from weekly notes)</div>
    ${notes.length ? notes.map(n=>`<div style="font-size:.85rem;margin-bottom:6px">${n.dept}: ${n.challenges}</div>`).join('') : '<div class="muted" style="font-size:.85rem">None recorded this period.</div>'}

    <div class="muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px">Conclusion</div>
    <div style="font-size:.85rem">Compiled from live records in the DCLM Bahrain Church Management System.</div>
  </div>`;
}

function exportReportPDF(){
  const period = reportGenState.period;
  const prefix = periodPrefix(period);
  const otherAdditions = (document.getElementById('reportOtherAdditions')||{}).value || '';

  const incomeThis = GIVING.filter(g=>g.date.slice(0,7)===prefix);
  const incomeTotal = incomeThis.reduce((s,g)=>s+g.amount,0);
  const expensesThis = EXPENSES.filter(x=>x.date.slice(0,7)===prefix);
  const expenseTotal = expensesThis.reduce((s,x)=>s+x.amount,0);
  const byFund = FUNDS.map(f=>({fund:f, total:incomeThis.filter(g=>g.fund===f).reduce((s,g)=>s+g.amount,0)})).filter(f=>f.total>0);

  const fwSessions = SESSIONS.filter(s=>s.meetingId==='fri-worship' && s.status==='filled' && s.date.slice(0,7)===prefix);

  const allSessionsThis = SESSIONS.filter(s=>s.status==='filled' && s.date.slice(0,7)===prefix);

        <li>Conclusion</li>
      </ol>
    </div>

    <div class="pr-page">
      <h2>1. Executive Summary</h2>
      <p>Friday Worship attendance totaled ${fwTotal} across ${fwSessions.length} recorded session(s) in ${period}. Giving for the period totaled ${fmt(incomeTotal)} against ${fmt(expenseTotal)} in expenses, a net position of ${fmt(incomeTotal-expenseTotal)}.</p>

      <h2>2. Attendance</h2>
      ${attendanceRows ? `<table class="pr-table"><thead><tr><th>Date</th><th>Meeting</th><th>Location</th><th>Total</th></tr></thead><tbody>${attendanceRows}</tbody></table>` : '<p class="pr-muted">No filled sessions recorded this period.</p>'}

      <h2>3. Finance</h2>
      <p><b>Income:</b> ${fmt(incomeTotal)} &nbsp; <b>Expenses:</b> ${fmt(expenseTotal)} &nbsp; <b>Net:</b> ${fmt(incomeTotal-expenseTotal)}</p>
      ${byFund.length ? `<table class="pr-table"><thead><tr><th>Fund</th><th>Amount</th></tr></thead><tbody>${byFund.map(f=>`<tr><td>${f.fund}</td><td>${fmt(f.total)}</td></tr>`).join('')}</tbody></table>` : ''}
      ${byCat.length ? `<table class="pr-table"><thead><tr><th>Expense category</th><th>Amount</th></tr></thead><tbody>${byCat.map(c=>`<tr><td>${c.cat}</td><td>${fmt(c.total)}</td></tr>`).join('')}</tbody></table>` : ''}

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select class="selectbox" onchange="setAuditEntity(this.value)">
          <option value="all" ${auditListState.entity==='all'?'selected':''}>All entities</option>
          ${uniqueEntities.map(e=>`<option value="${e}" ${auditListState.entity===e?'selected':''}>${e}</option>`).join('')}
        </select>
        <select class="selectbox" onchange="setAuditSort(this.value)">
          <option value="newest" ${auditListState.sort==='newest'?'selected':''}>Newest first</option>
          <option value="oldest" ${auditListState.sort==='oldest'?'selected':''}>Oldest first</option>
        </select>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="cardtable"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>
        ${pageRows.map(a=>`<tr>
          <td data-label="Time">${a.timestamp}</td>
          <td data-label="User">${a.user}</td>
          <td data-label="Action">${a.action}</td>
          <td data-label="Entity">${a.entity}: <b>${a.entityName}</b></td>
          <td data-label="Details" class="muted">${a.details||'—'}</td>
        </tr>`).join('')}
      </tbody></table>
      ${!pageRows.length ? '<div class="empty">No activity matches these filters.</div>' : ''}
    </div>
    ${list.length ? `<div class="list-pagination">
      <span class="muted" style="font-size:.82rem">Showing ${startIdx+1}–${Math.min(startIdx+pageSize,list.length)} of ${list.length}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn sm outline" ${auditListState.page<=1?'disabled':''} onclick="setAuditPage(-1,${totalPages})">Prev</button>
        <span class="muted" style="font-size:.82rem">Page ${auditListState.page} of ${totalPages}</span>
        <button class="btn sm outline" ${auditListState.page>=totalPages?'disabled':''} onclick="setAuditPage(1,${totalPages})">Next</button>
      </div>
    </div>` : ''}
  </div>`;
}
function setAuditEntity(v){ auditListState.entity=v; auditListState.page=1; renderContent(); }
function setAuditSort(v){ auditListState.sort=v; auditListState.page=1; renderContent(); }
function setAuditPage(delta, totalPages){ auditListState.page = Math.min(totalPages, Math.max(1, auditListState.page+delta)); renderContent(); }

function createUser(e){
  e.preventDefault(); const f = new FormData(e.target);
  userSeq++;
  USERS.push({id:userSeq, name:f.get('name'), role:f.get('role'), location:f.get('location')});
  logAudit('Created', 'User', f.get('name'), roleName(f.get('role')));
  setRoute('admin');
  return false;
}
function deleteUser(id){
  if(!confirmDelete('this user')) return;
  const u = USERS.find(u=>u.id===id);
  if(u) logAudit('Deleted', 'User', u.name, '');
  USERS = USERS.filter(u=>u.id!==id);
  setRoute('admin');
}

function createMeetingType(e){
  e.preventDefault(); const f = new FormData(e.target);
  const id = 'mt-' + Date.now();
  MEETING_TYPES.push({id, name:f.get('name'), day:f.get('day')||'—', freq:f.get('freq'), level:f.get('level'), target:null});
  logAudit('Created', 'Meeting Type', f.get('name'), '');
  setRoute('admin');
  return false;
}
function deleteMeetingType(id){
  if(!confirmDelete('this meeting type')) return;
  const m = MEETING_TYPES.find(m=>m.id===id);
  if(m) logAudit('Deleted', 'Meeting Type', m.name, '');
  MEETING_TYPES = MEETING_TYPES.filter(m=>m.id!==id);
  setRoute('admin');
}

function createHousehold(e){
  e.preventDefault();
  const f = new FormData(e.target);
  householdSeq++;
  HOUSEHOLDS.push({id:householdSeq, name:f.get('name'), address:f.get('address'), phone:f.get('phone')});
  logAudit('Created', 'Household', f.get('name'), '');
  setRoute('admin');
  return false;
}
function deleteHousehold(id){
  if(!confirmDelete('this household')) return;
  const h = HOUSEHOLDS.find(h=>h.id===id);
  const linked = MEMBERS.filter(m=>m.householdId===id);
  linked.forEach(m=> m.householdId = null);
  if(h) logAudit('Deleted', 'Household', h.name, '');
  HOUSEHOLDS = HOUSEHOLDS.filter(h=>h.id!==id);
  setRoute('admin');
}

const LISTS = { FUNDS: ()=>FUNDS, EXPENSE_CATEGORIES: ()=>EXPENSE_CATEGORIES, SOURCES: ()=>SOURCES };
function addListItem(e, which){
  e.preventDefault();
  const val = new FormData(e.target).get('val').trim();
  if(!val) return false;
  if(which==='FUNDS') FUNDS.push(val);
  if(which==='EXPENSE_CATEGORIES') EXPENSE_CATEGORIES.push(val);
  if(which==='SOURCES') SOURCES.push(val);
  setRoute('admin');
  return false;
}
function removeListItem(which, idx){
  if(which==='FUNDS') FUNDS.splice(idx,1);
  if(which==='EXPENSE_CATEGORIES') EXPENSE_CATEGORIES.splice(idx,1);
  if(which==='SOURCES') SOURCES.splice(idx,1);
  setRoute('admin');
}

/* ============================ RENDER SWITCH ============================ */
function renderContent(){
  const c = document.getElementById('content');
  let html = '';
  switch(state.route){
    case 'dashboard': html = viewDashboard(); break;
    case 'attendance': html = viewAttendance(state.routeParam); break;
    case 'members': html = viewMembers(state.routeParam); break;
    case 'newcomers': html = viewNewcomers(state.routeParam); break;
    case 'finance': html = viewFinance(); break;
    case 'goals': html = viewGoals(); break;
    case 'reports': html = viewReports(state.routeParam); break;
    case 'admin': html = viewAdmin(state.routeParam); break;
    default: html = viewDashboard();
  }
  c.innerHTML = html;
}

function loginAs(userId){
  const u = USERS.find(u=>u.id===userId);
  currentUser = u;
  state.role = u.role;
  state.location = u.location==='all' ? 'all' : u.location;
  state.route = 'dashboard'; state.routeParam = null;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = '';
  logAudit('Logged in', 'User', u.name, '');
  renderNav(); renderTopbar(); renderContent();
}

function logout(){
  if(currentUser) logAudit('Logged out', 'User', currentUser.name, '');
  currentUser = null;
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginScreen').innerHTML = viewLoginScreen();
}

/* ============================ INIT ============================ */
document.getElementById('loginScreen').style.display = 'flex';
document.getElementById('loginScreen').innerHTML = viewLoginScreen();
</script>
</body>
